{%- comment -%} Datos estructurados (JSON-LD) para Google. Un solo grafo por página. {%- endcomment -%}
{%- assign home = "/" | absolute_url -%}
{%- assign lukas = site.data.autores.lukas -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfessionalService",
      "@id": "{{ home }}#organizacion",
      "name": "IKUBERT",
      "legalName": "IKUBERT SpA",
      "url": "{{ home }}",
      "logo": "{{ '/src/logo-ikubert.svg' | absolute_url }}",
      "image": "{{ site.og_image | absolute_url }}",
      "description": {{ site.description | jsonify }},
      "email": "{{ site.contacto.email }}",
      "telephone": "{{ site.contacto.telefono_e164 }}",
      "address": { "@type": "PostalAddress", "addressLocality": "{{ site.contacto.ciudad }}", "addressRegion": "{{ site.contacto.region }}", "addressCountry": "{{ site.contacto.pais }}" },
      "areaServed": { "@type": "Country", "name": "Chile" },
      "founder": { "@id": "{{ lukas.url | absolute_url }}#persona" },
      "knowsAbout": ["Ciberseguridad","Hacking ético","Gestión de vulnerabilidades basada en riesgo","Ingeniería Civil Industrial","Optimización operativa","Arquitectura empresarial"],
      "sameAs": ["{{ site.contacto.linkedin }}"]
    },
    {
      "@type": "WebSite",
      "@id": "{{ home }}#sitio",
      "url": "{{ home }}",
      "name": "IKUBERT",
      "inLanguage": "es-CL",
      "publisher": { "@id": "{{ home }}#organizacion" }
    },
    {
      "@type": "Person",
      "@id": "{{ lukas.url | absolute_url }}#persona",
      "name": "{{ lukas.nombre }}",
      "alternateName": ["Lukas Ahubert", "Lukas Benjamín Ahubert Lennon"],
      "url": "{{ lukas.url | absolute_url }}",
      "image": "{{ lukas.foto | absolute_url | replace: ' ', '%20' }}",
      "jobTitle": "Gerente General",
      "knowsAbout": ["Ingeniería Civil Industrial","Investigación de operaciones","Optimización de procesos","Cadenas de Markov","Ciberseguridad ofensiva","Gestión de vulnerabilidades basada en riesgo (RBVM)","Hacking ético"],
      "worksFor": { "@id": "{{ home }}#organizacion" },
      "sameAs": ["{{ lukas.linkedin }}", "{{ lukas.github }}"]
    }
    {%- if page.layout == "post" -%}
    {%- assign a = site.data.autores[page.autor] -%}
    ,{
      "@type": "{{ page.schema_tipo | default: 'BlogPosting' }}",
      "@id": "{{ page.url | absolute_url }}#articulo",
      "headline": {{ page.title | truncate: 110 | jsonify }},
      "description": {{ page.description | default: page.resumen | strip_html | jsonify }},
      "image": ["{{ page.image | default: site.og_image | absolute_url }}"],
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      "inLanguage": "es-CL",
      "mainEntityOfPage": "{{ page.url | absolute_url }}",
      {%- if page.autor == "lukas" %}
      "author": { "@id": "{{ lukas.url | absolute_url }}#persona" },
      {%- else %}
      "author": { "@id": "{{ home }}#organizacion" },
      {%- endif %}
      "publisher": { "@id": "{{ home }}#organizacion" },
      {%- if page.keywords %}"keywords": {{ page.keywords | join: ", " | jsonify }},{% endif %}
      {%- if page.linkedin and page.linkedin != "" %}"sameAs": ["{{ page.linkedin }}"],{% endif %}
      {%- if page.repositorio %}
      "about": { "@id": "{{ page.url | absolute_url }}#software" },
      {%- endif %}
      "articleSection": {{ page.categoria | jsonify }}
    }
    {%- if page.repositorio -%}
    ,{
      "@type": "SoftwareSourceCode",
      "@id": "{{ page.url | absolute_url }}#software",
      "name": {{ page.software_nombre | jsonify }},
      "description": {{ page.software_descripcion | jsonify }},
      "codeRepository": "{{ page.repositorio }}",
      "license": "https://www.gnu.org/licenses/agpl-3.0.html",
      "programmingLanguage": "Python",
      "author": { "@id": "{{ lukas.url | absolute_url }}#persona" },
      "creator": { "@id": "{{ lukas.url | absolute_url }}#persona" },
      "copyrightHolder": { "@id": "{{ lukas.url | absolute_url }}#persona" }
    }
    {%- endif -%}
    ,{
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "{{ home }}" },
        { "@type": "ListItem", "position": 2, "name": "Foro", "item": "{{ '/foro/' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
      ]
    }
    {%- elsif page.collection == "servicios" -%}
    ,{
      "@type": "Service",
      "@id": "{{ page.url | absolute_url }}#servicio",
      "name": {{ page.framework | append: " — " | append: page.nombre_servicio | jsonify }},
      "serviceType": {{ page.nombre_servicio | jsonify }},
      "description": {{ page.description | jsonify }},
      "provider": { "@id": "{{ home }}#organizacion" },
      "areaServed": { "@type": "Country", "name": "Chile" },
      "url": "{{ page.url | absolute_url }}"
    },{
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "{{ home }}" },
        { "@type": "ListItem", "position": 2, "name": "Servicios", "item": "{{ '/servicios/' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.framework | jsonify }}, "item": "{{ page.url | absolute_url }}" }
      ]
    }
    {%- elsif page.layout == "autor" -%}
    ,{
      "@type": "ProfilePage",
      "@id": "{{ page.url | absolute_url }}",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "mainEntity": { "@id": "{{ lukas.url | absolute_url }}#persona" }
    }
    {%- endif %}
  ]
}
</script>
